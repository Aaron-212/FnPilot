name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release"
        required: true

permissions: {}

jobs:
  release:
    name: Build and draft release
    runs-on: macos-26
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release_tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
            git checkout --detach "$tag"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          git fetch origin main:refs/remotes/origin/main

          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag '$tag' does not point to a commit on origin/main."
            exit 1
          fi

          if [[ "$tag" =~ ^v?([0-9]+(\.[0-9]+){0,2})$ ]]; then
            app_version="${BASH_REMATCH[1]}"
          else
            echo "::error::Tag '$tag' must be a version like '1.2.3' or 'v1.2.3'."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "safe_tag=${tag//\//-}" >> "$GITHUB_OUTPUT"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "build_number=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build ad-hoc signed Release app
        run: |
          xcodebuild \
            -project FnPilot.xcodeproj \
            -scheme FnPilot \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build/DerivedData \
            MARKETING_VERSION="${{ steps.release_tag.outputs.app_version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.release_tag.outputs.build_number }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            build

      - name: Verify ad-hoc signature
        run: |
          app_path="build/DerivedData/Build/Products/Release/FnPilot.app"
          codesign --verify --strict --deep --verbose=2 "$app_path"
          codesign --display --verbose=2 "$app_path"

      - name: Package app bundle
        run: |
          mkdir -p build/artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            build/DerivedData/Build/Products/Release/FnPilot.app \
            "build/artifacts/FnPilot-${{ steps.release_tag.outputs.safe_tag }}-adhoc.zip"

      - name: Attest build artifact
        uses: actions/attest@v4
        with:
          subject-path: build/artifacts/FnPilot-${{ steps.release_tag.outputs.safe_tag }}-adhoc.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: FnPilot-${{ steps.release_tag.outputs.safe_tag }}-adhoc
          path: build/artifacts/FnPilot-${{ steps.release_tag.outputs.safe_tag }}-adhoc.zip
          if-no-files-found: error

      - name: Draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
          RELEASE_ASSET_TAG: ${{ steps.release_tag.outputs.safe_tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            "build/artifacts/FnPilot-${RELEASE_ASSET_TAG}-adhoc.zip" \
            --title "$RELEASE_TAG" \
            --notes "Ad-hoc signed FnPilot app bundle built with Release optimization. This build is not notarized." \
            --draft
