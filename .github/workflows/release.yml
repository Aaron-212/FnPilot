name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and draft release
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release_tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
            git checkout --detach "$tag"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          git fetch origin main:refs/remotes/origin/main

          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag '$tag' does not point to a commit on origin/main."
            exit 1
          fi

          if [[ "$tag" =~ ^v?([0-9]+(\.[0-9]+){0,2})$ ]]; then
            app_version="${BASH_REMATCH[1]}"
          else
            echo "::error::Tag '$tag' must be a version like '1.2.3' or 'v1.2.3'."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "safe_tag=${tag//\//-}" >> "$GITHUB_OUTPUT"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"

      - name: Build unsigned Release app
        run: |
          xcodebuild \
            -project FnPilot.xcodeproj \
            -scheme FnPilot \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build/DerivedData \
            MARKETING_VERSION="${{ steps.release_tag.outputs.app_version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.release_tag.outputs.app_version }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Strip ad-hoc signature
        run: |
          app_path="build/DerivedData/Build/Products/Release/FnPilot.app"
          codesign --remove-signature "$app_path" || true

          if codesign -dv "$app_path" 2>/dev/null; then
            echo "::error::Expected unsigned app bundle, but codesign still found a signature."
            exit 1
          fi

      - name: Package app bundle
        run: |
          mkdir -p build/artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            build/DerivedData/Build/Products/Release/FnPilot.app \
            "build/artifacts/FnPilot-${{ steps.release_tag.outputs.safe_tag }}-unsigned.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: FnPilot-${{ steps.release_tag.outputs.safe_tag }}-unsigned
          path: build/artifacts/FnPilot-${{ steps.release_tag.outputs.safe_tag }}-unsigned.zip
          if-no-files-found: error

      - name: Draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
          RELEASE_ASSET_TAG: ${{ steps.release_tag.outputs.safe_tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            "build/artifacts/FnPilot-${RELEASE_ASSET_TAG}-unsigned.zip" \
            --title "$RELEASE_TAG" \
            --notes "Unsigned FnPilot app bundle built with Release optimization." \
            --draft
